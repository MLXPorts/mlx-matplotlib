---
name: Tests

on:
  push:
    branches:
      - main
      - v[0-9]+.[0-9]+.x
  pull_request:
    branches:
      - main
      - v[0-9]+.[0-9]+.x
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}-${{ github.event.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NO_AT_BRIDGE: 1
  OPENBLAS_NUM_THREADS: 1
  PYTHONFAULTHANDLER: 1

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    if: >-
      !contains(github.event.head_commit.message, '[ci skip]') &&
      !contains(github.event.head_commit.message, '[skip ci]')

    strategy:
      fail-fast: false
      matrix:
        # MLX is an Apple Silicon tensor backend and is a hard build
        # requirement (src/meson.build links libmlx), so tests run on
        # macos-15 (arm64) only. ubuntu-latest cannot configure the build.
        os: [macos-15]
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Verify Apple Silicon runner
        run: |
          sw_vers
          python -c "import platform; assert platform.machine() == 'arm64', platform.machine()"

      - name: Install system dependencies (macOS)
        run: |
          brew install pkg-config ccache

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements/testing/all.txt -r requirements/testing/extra.txt

      - name: Install MLX
        run: |
          python -m pip install mlx

      - name: Install build dependencies
        run: |
          # meson-python editable installs rebuild the C extensions on every
          # import via ninja, which needs the build backend (and nanobind's
          # C++ sources) to persist in the environment. Install the build
          # requirements here so the editable rebuild works with
          # --no-build-isolation below; otherwise the isolated build env is
          # discarded after install and the on-import rebuild fails.
          python -m pip install \
            "meson-python>=0.13.1,!=0.17.*" \
            "meson>=1.2.3" \
            ninja \
            "nanobind>=2.4.0" \
            "pybind11>=2.13.2,!=2.13.3,<4" \
            "setuptools_scm>=7"

      - name: Build and install matplotlib
        id: install
        run: |
          python -m pip install --no-build-isolation --verbose --editable .[dev]

      - name: Check matplotlib imports
        run: |
          python -c "import matplotlib; print(f'Matplotlib version: {matplotlib.__version__}')"
          python -c "import matplotlib.pyplot as plt; print('pyplot imports successfully')"

      - name: Check MLX backend
        run: |
          python -c "import mlx.core as mx; print(f'MLX version: {mx.__version__}')"
          python -c "import matplotlib; import mlx.core as mx; print('MLX + Matplotlib imports successfully')"

      - name: Run native MLX regressions
        run: |
          python -m pytest -ra --timeout=300 --junitxml=test-results/native.xml \
            lib/matplotlib/tests/test_agg.py \
            lib/matplotlib/tests/test_axes.py \
            lib/matplotlib/tests/test_transforms.py \
            lib/matplotlib/tests/test_cbook.py \
            lib/matplotlib/tests/test_mlab.py \
            lib/matplotlib/tests/test_path.py \
            lib/matplotlib/tests/test_bezier.py \
            lib/matplotlib/tests/test_quiver.py \
            lib/matplotlib/tests/test_streamplot.py \
            lib/matplotlib/tests/test_text.py \
            -k 'native or accepts_mlx_stream or bottom_alignment_preserves'

      - name: Run spectral regressions
        run: |
          python -m pytest -ra --timeout=300 \
            --junitxml=test-results/spectral.xml \
            lib/matplotlib/tests/test_mlab.py -k 'TestSpectral'

      - name: Run tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          python -m pytest -rfEsXR --timeout=300 --durations=25 \
            -n 2 --dist=loadfile \
            --cov=matplotlib --cov=mpl_toolkits --cov-report=xml:coverage.xml \
            --junitxml=test-results/full.xml --color=yes \
            lib/matplotlib/tests lib/mpl_toolkits

      - name: Upload test reports and image comparisons
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-results-py${{ matrix.python-version }}-${{ matrix.os }}
          path: |
            test-results/
            coverage.xml
            result_images/
          if-no-files-found: warn

      - name: Upload coverage
        if: ${{ always() && matrix.python-version == '3.12' }}
        uses: codecov/codecov-action@v7.1.1
        with:
          files: coverage.xml
        continue-on-error: true

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: Run ruff
        run: |
          ruff check .
